ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 실제 TurtleBot3 Waffle 펌웨어(turtlebot3_node) 기본 토픽/프레임
    odom0: odom
    # 위치/속도는 휠 오도메트리를 신뢰, 회전(yaw)은 제외 — 바닥 미끄러짐으로 드리프트되는 축을 배제
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: imu
    # 회전(yaw)/각속도는 IMU를 신뢰, 위치는 미사용 — IMU는 적분 누적오차 때문에 위치 추정에는 안 씀
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    use_control: false
